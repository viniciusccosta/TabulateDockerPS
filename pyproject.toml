[tool.poetry]
name = "tabulatedockerps"
version = "0.3.0"
description = "Script Python que formata em tabela a saída do `docker ps`"
authors = ["viniciusccosta <viniciusccosta95@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/viniciusccosta/TabulateDockerPS"
repository = "https://github.com/viniciusccosta/TabulateDockerPS"
keywords = ["docker", "tabulate", "command-line", "cli"]

[tool.poetry.scripts]
tdps = "tabulatedockerps.tdps:entry_point"

[tool.poetry.dependencies]
python = "~3.13"
tabulate = "^0.9.0"


[tool.poetry.group.dev.dependencies]
pre-commit = "^4.6.0"
isort = "^8.0.1"
black = "^26.5.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
